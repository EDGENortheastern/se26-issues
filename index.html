<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello Name App</h1>
    <button type="button" popovertarget="how-it-works" aria-label="How it works">
        <img src="assets/info_sign.svg" alt="" width="24" height="24">
    </button>

    <div id="how-it-works" popover>
        <img src="assets/info_sign.svg" alt="" width="24" height="24">
        <h2>How it works</h2>
        <ol>
            <li>Type your name in the box.</li>
            <li>Tap Submit.</li>
            <li>The app says hello to you. Tap Restart to try another name.</li>
        </ol>
    </div>
    <p>Enter your name below</p>
    <label for="name">Name:</label>
    <input type="text" name="" id="name" placeholder="Your Name">
    <button type="submit">Submit</button>
</body>
</html>
